name: marble_maze_app
description: A 3D tilt-the-board marble maze.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  box3d: 0.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  level_domain:
    path: ../../features/level/level_domain
  level_presentation:
    path: ../../features/level/level_presentation
  material_ui: ^1.1.1
  simulation_data_box3d:
    path: ../../features/simulation/simulation_data_box3d


dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

name: marble_maze_app
description: A 3D tilt-the-board marble maze.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  box3d: 0.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.1
  intl: ^0.20.2
  level_data:
    path: ../../features/level/level_data
  level_domain:
    path: ../../features/level/level_domain
  level_presentation:
    path: ../../features/level/level_presentation
  localizations:
    path: ../../shared/localizations
  material_ui: ^1.1.1
  progress_data_shared_preferences:
    path: ../../features/progress/progress_data_shared_preferences
  progress_domain:
    path: ../../features/progress/progress_domain
  settings_data_shared_preferences:
    path: ../../features/settings/settings_data_shared_preferences
  settings_domain:
    path: ../../features/settings/settings_domain
  simulation_data_box3d:
    path: ../../features/simulation/simulation_data_box3d
  tilt_data_sensors_plus:
    path: ../../features/tilt/tilt_data_sensors_plus
  tilt_domain:
    path: ../../features/tilt/tilt_domain
  ui_kit:
    path: ../../shared/ui_kit

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  shared_preferences: ^2.5.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
